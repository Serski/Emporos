<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ports, Flat</title>
<meta name="description" content="Samples of Rhodes, Piraeus and Syracuse and their merchants in clean, flat pixel art, for Emporos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --glaze: #16100c; --line: #4b3727; --line-soft: #34261b;
  --clay: #d97b46; --bone: #f2e6cb; --bone-dim: #bba887; --gold: #eac05a;
  --font-pixel: "Pixelify Sans", ui-monospace, "Courier New", monospace;
  --font-story: "Literata", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; font-variant-ligatures: none; }
html, body { margin: 0; background: var(--glaze); color: var(--bone); }
body { font: 16px/1.5 var(--font-story); -webkit-font-smoothing: antialiased; }
main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { margin: 0; font: 700 30px/1.1 var(--font-pixel); letter-spacing: 0.03em; }
.sub { margin: 6px 0 0; font: 500 13px/1.3 var(--font-pixel); color: var(--bone-dim); letter-spacing: 0.08em; text-transform: uppercase; }
p.lede { max-width: 40em; margin: 14px 0 0; }
h2 { margin: 30px 0 10px; display: flex; align-items: center; gap: 10px; font: 600 13px/1 var(--font-pixel); letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay); }
h2::after { content: ""; flex: 1; height: 2px; background: var(--line-soft); }
figure { margin: 0; }
.frame { position: relative; max-width: 100%; margin: 0 auto; border: 2px solid var(--line); background: #000; line-height: 0; }
canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
figcaption { max-width: 40em; margin: 10px auto 0; font-size: 15px; color: var(--bone-dim); }
.frame.cast { margin-top: 10px; }
.names { display: grid; grid-template-columns: repeat(8, 1fr); margin: 8px auto 0; font: 500 12px/1.2 var(--font-pixel); color: var(--bone-dim); text-align: center; letter-spacing: 0.04em; }
.names b { display: block; color: var(--bone); font-weight: 600; }
@media (max-width: 620px) { .names { font-size: 10px; } }
</style>
</head>
<body>
<main>
  <h1>The ports, flat</h1>
  <p class="sub">Emporos · art sample · flat, 224 × 126</p>
  <p class="lede">The game's own flat look, a step bigger and cleaner: people about 22 pixels tall instead of 11, two or three flat shades to each colour, soft colours, no outlines and no dithering.</p>

  <h2>Rhodes</h2>
  <figure>
    <div class="frame" id="rhodesBox"><canvas id="rhodes" width="224" height="126" role="img" aria-label="The harbour at Rhodes in flat pixel art: the town and temple on the hill, the Sun-god's feet in the scaffold, Elpis at the quay, and seven merchants standing by their stalls."></canvas></div>
    <div class="frame cast" id="rhodesCastBox"><canvas id="rhodesCast" width="176" height="32" role="img" aria-label="The seven merchants of Rhodes and Ariston."></canvas></div>
    <div class="names" id="rhodesNames"><span><b>Thrasyllos</b>wine</span><span><b>Korinna</b>sponges</span><span><b>Aristeia</b>cups</span><span><b>Damagetos</b>arsenal</span><span><b>Myrto</b>stores</span><span><b>Aristokles</b>the statue</span><span><b>Antimachos</b>banker</span><span><b>Ariston</b>you</span></div>
  </figure>

  <h2>Piraeus</h2>
  <figure>
    <div class="frame" id="piraeusBox"><canvas id="piraeus" width="224" height="126" role="img" aria-label="Piraeus in flat pixel art: the ship sheds and a trireme, the Long Walls running to Athens and the Acropolis, Hymettus behind, the garrison on Munichia with its flag, the long stoa, Elpis, and eight merchants by their stalls."></canvas></div>
    <div class="frame cast" id="piraeusCastBox"><canvas id="piraeusCast" width="176" height="32" role="img" aria-label="The eight traders of Piraeus."></canvas></div>
    <div class="names" id="piraeusNames"><span><b>Kephisodoros</b>oil</span><span><b>Wardens</b>grain</span><span><b>Philinna</b>vases</span><span><b>Nikanor</b>books</span><span><b>Melitta</b>honey</span><span><b>Timarchos</b>marble</span><span><b>Zeno</b>talk</span><span><b>Glaukippe</b>stores</span></div>
  </figure>

  <h2>Syracuse</h2>
  <figure>
    <div class="frame" id="syracuseBox"><canvas id="syracuse" width="224" height="126" role="img" aria-label="Syracuse in flat pixel art: Etna smoking under its snow, Ortygia with the temple of Athena and its golden shield, the dockyards and a great warship, Tyche at the quay, and seven merchants by their stalls."></canvas></div>
    <div class="frame cast" id="syracuseCastBox"><canvas id="syracuseCast" width="154" height="32" role="img" aria-label="Seven placeholder traders of Syracuse."></canvas></div>
    <div class="names" id="syracuseNames" style="grid-template-columns: repeat(7, 1fr)"><span><b>Sikon</b>wheat</span><span><b>Arete</b>cheese</span><span><b>Damon</b>tuna</span><span><b>Kallisto</b>honey</span><span><b>Eumenes</b>wine</span><span><b>Nymphodoros</b>sulphur</span><span><b>Lykon</b>banker</span></div>
    <figcaption>Chapter VI is not written yet, so these traders are placeholders. Tyche, the bigger ship, lies at the quay.</figcaption>
  </figure>
</main>
<script>
'use strict';
// ---------- tools ----------
const RGBC = new Map();
function rgb(c) { let v = RGBC.get(c); if (!v) { const n = parseInt(c.slice(1), 16); v = [n >> 16 & 255, n >> 8 & 255, n & 255]; RGBC.set(c, v); } return v; }
const hx = (r, g, b) => '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
function mix(a, b, t) { const A = rgb(a), B = rgb(b); return hx(Math.round(A[0] + (B[0] - A[0]) * t), Math.round(A[1] + (B[1] - A[1]) * t), Math.round(A[2] + (B[2] - A[2]) * t)); }
const dk = (c, k) => mix(c, '#3a3060', k), lt = (c, k) => mix(c, '#fff8e8', k);   // soft shadows lean blue-violet, light leans warm
let G = null;
function R(x, y, w, h, c) { if (w <= 0 || h <= 0) return; G.fillStyle = c; G.fillRect(Math.floor(x), Math.floor(y), Math.round(w), Math.round(h)); }
function P(x, y, c) { G.fillStyle = c; G.fillRect(Math.floor(x), Math.floor(y), 1, 1); }
function line(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx + dy; G.fillStyle = c;
  for (let i = 0; i < 400; i++) { G.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
}
function canvasOf(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function spr(w, h, fn) { const c = canvasOf(w, h), prev = G; G = c.getContext('2d'); fn(); G = prev; return c; }
function flipX(c) { const o = canvasOf(c.width, c.height), g = o.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); return o; }
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ---------- a soft, flat palette ----------
const K = {
  sky: ['#93c4e4', '#a9d0ea', '#bfdcee', '#d3e7f0'], sun: '#fff7dc', sunRing: '#f4eed4', cloud: '#ffffff', cloudS: '#dce7f1',
  far: '#b4c1dc', far2: '#a3b2d2', sea: ['#88c7df', '#70b7d6', '#5ba7cc', '#4c98c1'], wave: '#c2e5f0', seaS: '#4a8fba',
  hill: '#dfcb98', hillS: '#cdb680', scrub: '#a0ac64', scrubS: '#84944f', cyp: '#4f7b4f', cypS: '#3b5f3e',
  wallF: '#f4ecdc', wallS: '#dccdb0', roof: '#d47c52', roofS: '#b4603e', win: '#5c4846',
  stone: '#e6d8b8', stoneL: '#f3e9d2', stoneS: '#cbbb98', stoneJ: '#b9a786', marble: '#fbf8f0', marbleS: '#e2dbca',
  bronze: '#e2a65a', bronzeS: '#b47a3e', wood: '#b4844f', woodS: '#8a5e38', woodD: '#6a4428', linen: '#f3ead6', linenS: '#dccfb4',
  quay: '#ebe0c6', quayS: '#ddd0b2', quayJ: '#c9ba98', hull: '#7e5132', hullS: '#5a3822', band: '#c45a3a', rail: '#cf9c62',
};

// ---------- people: a whole figure about 22 pixels tall, facing a little to the right ----------
const LOOKS = {
  thras: { skin: '#c48a58', hair: '#3a281c', style: 'short', beard: 2, robe: '#8b3240', trim: '#ead7ae' },
  korinna: { skin: '#b97f50', hair: '#24180f', style: 'veil', veil: '#3f6f8e', beard: 0, robe: '#d2b27a', trim: '#8a5a34', f: true },
  aristeia: { skin: '#cf9a6a', hair: '#bfb7aa', style: 'veil', veil: '#4a4038', beard: 0, robe: '#5a4a3e', trim: '#c8623a', f: true },
  arsenal: { skin: '#b07a4c', hair: '#5a4632', style: 'bald', beard: 1, robe: '#5f6b4a', trim: '#d9a441' },
  stores: { skin: '#c99468', hair: '#6b4a2e', style: 'long', beard: 0, robe: '#9a6a3a', trim: '#efe3cc', f: true },
  works: { skin: '#b88252', hair: '#2d2018', style: 'curly', beard: 2, robe: '#e9dcc0', trim: '#b0773a', hat: 'pilos' },
  bank: { skin: '#c99a6c', hair: '#d8d2c4', style: 'short', beard: 1, robe: '#2f4a6a', trim: '#e3b453' },
  ariston: { skin: '#c99062', hair: '#3a2618', style: 'short', beard: 0, robe: '#3f6f8e', trim: '#efe3cc' },
  kephis: { skin: '#c48a58', hair: '#2a1d14', style: 'short', beard: 2, robe: '#6b7a44', trim: '#e3b453' },
  warden: { skin: '#b88252', hair: '#bfb7aa', style: 'short', beard: 2, robe: '#efe6d6', trim: '#3f6f8e' },
  philinna: { skin: '#d0a070', hair: '#1f1712', style: 'veil', veil: '#3a3430', beard: 0, robe: '#c8623a', trim: '#2a2220', f: true },
  nikanor: { skin: '#c99062', hair: '#3a2618', style: 'short', beard: 1, robe: '#4a4440', trim: '#efe3cc' },
  melitta: { skin: '#cf9a6a', hair: '#7a4a22', style: 'long', beard: 0, robe: '#e3b453', trim: '#6e3e1a', f: true },
  timarchos: { skin: '#a8724a', hair: '#3b2c22', style: 'short', beard: 2, robe: '#8a7a64', trim: '#efe3cc' },
  zeno: { skin: '#a8703f', hair: '#2a1d14', style: 'short', beard: 1, robe: '#6b6458', trim: '#3a3430' },
  pstores: { skin: '#c99468', hair: '#6b4a2e', style: 'veil', veil: '#8a5a34', beard: 0, robe: '#9a6a3a', trim: '#efe3cc', f: true },
  sikon: { skin: '#b88252', hair: '#2a1d14', style: 'short', beard: 2, robe: '#c9a050', trim: '#5a3a22' },
  arete: { skin: '#cf9a6a', hair: '#3a2416', style: 'veil', veil: '#efe6d6', beard: 0, robe: '#6b7a44', trim: '#efe3cc', f: true },
  damon: { skin: '#a8703f', hair: '#1b130e', style: 'curly', beard: 1, robe: '#3d6b6b', trim: '#efe3cc' },
  kallisto: { skin: '#d0a070', hair: '#7a3f1e', style: 'long', beard: 0, robe: '#e3b453', trim: '#6e3e1a', f: true },
  eumenes: { skin: '#c08857', hair: '#4a2f1c', style: 'short', beard: 2, robe: '#6a2a5a', trim: '#e3b453' },
  nymphodoros: { skin: '#b07a4c', hair: '#5a4632', style: 'bald', beard: 2, robe: '#8a7a64', trim: '#d9a441' },
  lykon: { skin: '#c99a6c', hair: '#9a9488', style: 'short', beard: 2, robe: '#efe6d6', trim: '#2f4a6a' },
};
function person(L, blink) {
  return spr(18, 26, () => {
    const o = 2, sk = L.skin, skS = dk(sk, 0.2), hr = L.hair, hrL = lt(hr, 0.2), hrS = dk(hr, 0.2);
    const rb = L.robe, rbS = dk(rb, 0.22), rbL = lt(rb, 0.16), tr = L.trim, trS = dk(tr, 0.18), fem = !!L.f;
    // legs and sandals, or the hem of a long chiton
    if (!fem) { R(6, o + 19, 2, 3, skS); R(10, o + 19, 2, 3, sk); R(6, o + 22, 3, 1, '#6a4a30'); R(10, o + 22, 3, 1, '#8a5e38'); }
    else { P(7, o + 22, skS); P(8, o + 22, '#6a4a30'); P(11, o + 22, sk); P(12, o + 22, '#8a5e38'); }
    if (!fem) { R(5, o + 16, 8, 3, rb); R(5, o + 16, 2, 3, rbS); R(12, o + 16, 1, 2, rbL); R(5, o + 18, 8, 1, trS); }
    else { R(5, o + 16, 8, 3, rb); R(4, o + 19, 10, 3, rb); R(5, o + 16, 2, 3, rbS); R(4, o + 19, 2, 3, rbS); R(12, o + 16, 1, 3, rbL); R(13, o + 19, 1, 2, rbL); R(9, o + 17, 1, 4, rbS); R(4, o + 21, 10, 1, trS); }
    // the body, a belt, and for the men a cloak's edge across the chest
    R(5, o + 10, 8, 6, rb); R(5, o + 10, 2, 6, rbS); R(12, o + 11, 1, 5, rbL);
    if (!fem) for (let k = 0; k < 6; k++) R(6 + k, o + 10 + k, 2, 1, k > 3 ? trS : tr);
    R(5, o + (fem ? 12 : 15), 8, 1, fem ? tr : rbS);
    // arms hanging at the sides
    R(4, o + 10, 1, 3, rbS); R(4, o + 13, 1, 3, skS); P(4, o + 16, skS);
    R(13, o + 10, 1, 3, rb); R(13, o + 13, 1, 3, sk); P(13, o + 16, sk);
    // neck and head
    R(8, o + 9, 3, 1, skS);
    R(5, o + 3, 7, 5, sk); R(6, o + 8, 5, 1, sk); R(5, o + 3, 1, 5, skS);
    P(6, o + 5, skS);
    P(8, o + 5, blink ? skS : '#3a2420'); P(10, o + 5, blink ? skS : '#3a2420');
    P(10, o + 7, fem ? '#c46a62' : '#9a4a40');
    const st = L.style;
    if (st === 'veil') {
      const v = L.veil, vL = lt(v, 0.2), vS = dk(v, 0.22);
      R(5, o + 1, 7, 2, v); R(7, o + 1, 3, 1, vL); R(4, o + 2, 1, 1, v); R(3, o + 3, 3, 11, v); R(3, o + 3, 1, 11, vS); P(12, o + 3, v);
      R(6, o + 3, 6, 1, hr); P(6, o + 4, hr);
    } else if (st === 'bald') {
      R(6, o + 2, 5, 1, sk); P(9, o + 2, lt(sk, 0.3)); P(8, o + 3, lt(sk, 0.2)); R(5, o + 4, 1, 3, hr); P(6, o + 3, hr);
    } else {
      R(5, o + 1, 7, 2, hr); R(8, o + 1, 3, 1, hrL); R(5, o + 3, 2, 2, hr); P(5, o + 5, hr); P(11, o + 3, hrS);
      if (st === 'curly') { P(6, o, hr); P(8, o, hr); P(10, o, hrL); P(4, o + 2, hr); P(4, o + 4, hr); }
      if (st === 'long') { R(3, o + 3, 3, 9, hr); R(3, o + 3, 1, 9, hrS); P(4, o + 12, hrS); }
    }
    if (L.f && st !== 'veil') P(6, o + 6, '#e3b453');
    if (L.f && st === 'veil') P(6, o + 6, '#e3b453');
    if (L.beard === 1) { R(6, o + 7, 6, 2, hr); P(10, o + 7, '#7a3a30'); P(11, o + 7, hrL); }
    if (L.beard === 2) { R(6, o + 6, 6, 3, hr); R(7, o + 9, 4, 1, hr); P(10, o + 7, '#5a2a24'); P(11, o + 6, hrL); P(9, o + 6, hrL); }
    if (L.hat === 'pilos') { const f = '#a07a4a'; R(5, o + 1, 7, 2, f); R(6, o, 5, 1, f); R(7, o - 1, 3, 1, f); P(8, o - 2, lt(f, 0.2)); R(9, o, 2, 2, lt(f, 0.18)); R(5, o + 2, 7, 1, dk(f, 0.2)); }
  });
}
const FIG = {}; for (const id in LOOKS) FIG[id] = [person(LOOKS[id], false), person(LOOKS[id], true)];

// ---------- shared scenery ----------
const W = 224, H = 126, HZ = 62, SHORE = 70, QY = 96, WL = 88;
function cloud(x, y, w) { R(x + 3, y, w - 9, 2, K.cloud); R(x + w - 9, y - 1, 5, 1, K.cloud); R(x, y + 2, w, 3, K.cloud); R(x + 1, y + 5, w - 2, 1, K.cloudS); R(x + 4, y - 1, 4, 1, K.cloud); }
function skyAndSun(sx, sy) {
  K.sky.forEach((c, i) => R(0, i * 16, W, 16, c)); R(0, 48, W, HZ - 48, K.sky[3]);
  for (let y = -9; y <= 9; y++) for (let x = -9; x <= 9; x++) { const d = Math.hypot(x, y); if (d <= 6.4) P(sx + x, sy + y, K.sun); else if (d <= 8.6) P(sx + x, sy + y, K.sunRing); }
}
function seaBands() { K.sea.forEach((c, i) => R(0, HZ + i * 9, W, 9, c)); R(0, HZ, W, 1, '#c8e6ef'); }
function house(x, yb, w, h) { R(x, yb - h, w, h, K.wallF); R(x + w, yb - h, 1, h, K.wallS); R(x - 1, yb - h - 2, w + 2, 1, K.roof); R(x - 1, yb - h - 1, w + 2, 1, K.roofS); P(x + 1, yb - h + 1, K.win); if (w > 5) P(x + 4, yb - h + 1, K.win); if (hash(x * 3 + yb) < 0.5) { P(x + w - 2, yb - 2, K.win); P(x + w - 2, yb - 1, K.win); } }
function cypress(x, yb, h) { R(x, yb - h, 2, h, K.cyp); R(x, yb - h, 1, h, K.cypS); P(x, yb - h - 1, K.cyp); }
function rowsOfHouses(top, x0, x1, y0, y1, skip) {   // houses in rows down a slope, with the odd cypress
  for (let yb = y0, r = 0; yb <= y1; yb += 5, r++) for (let x = x0 + (r * 3) % 7 - 3; x < x1; x += 8 + Math.floor(hash(r * 31 + x) * 3)) {
    const w = 5 + Math.floor(hash(x * 7 + r) * 2);
    if (Math.max(top(x), top(x + w + 1)) > yb - 1 || (skip && skip(x, yb, w))) continue;
    if (hash(x + r * 13) < 0.12) { cypress(x + 2, yb, 7); continue; }
    house(x, yb, w, 4);
  }
}
function seaWall(x0, x1, towers) {
  R(x0, 63, x1 - x0, 7, K.stone); R(x0, 63, x1 - x0, 1, K.stoneL); R(x0, 66, x1 - x0, 1, K.stoneJ); R(x0, 69, x1 - x0, 1, K.stoneS);
  for (let x = x0; x < x1; x += 3) R(x, 61, 2, 2, K.stone);
  for (const tx of towers) { R(tx, 55, 7, 15, K.stone); R(tx + 7, 55, 2, 15, K.stoneL); for (let i = 0; i < 9; i += 3) R(tx + i, 53, 2, 2, i > 6 ? K.stoneL : K.stone); R(tx + 3, 58, 1, 2, K.win); R(tx, 60, 9, 1, K.stoneJ); }
}
function flatTemple(x0, yb, w, h, gold) {   // steps, columns, a painted frieze, a pediment
  const cx = x0 + (w >> 1);
  R(x0 - 2, yb, w + 4, 1, K.marbleS); R(x0 - 1, yb - 1, w + 2, 1, K.marble); R(x0, yb - 2, w, 1, K.marbleS);
  R(x0 + 1, yb - 2 - h, w - 2, h, '#d8cdb6');
  for (let x = x0 + 1; x < x0 + w - 2; x += 4) { R(x, yb - 2 - h, 2, h, K.marble); R(x + 1, yb - 1 - h, 1, h - 1, K.marbleS); }
  R(x0, yb - 4 - h, w, 2, K.marble); R(x0, yb - 5 - h, w, 1, '#7d9cc6'); R(x0 - 1, yb - 6 - h, w + 2, 1, K.marble);
  const ph = Math.max(3, Math.round(w / 7));
  for (let j = 0; j < ph; j++) { const half = Math.round((w / 2 + 1) * (1 - (j + 1) / (ph + 1))); R(cx - half, yb - 7 - h - j, half * 2, 1, j ? K.marble : K.marbleS); P(cx - half - 1, yb - 7 - h - j, K.roof); P(cx + half, yb - 7 - h - j, K.roof); }
  if (gold) { R(cx - 2, yb - 9 - h - ph, 4, 3, K.bronze); P(cx - 2, yb - 9 - h - ph, K.marble); P(cx + 1, yb - 9 - h - ph, '#fff0b0'); R(cx - 1, yb - 10 - h - ph, 2, 1, K.bronze); return [cx, yb - 10 - h - ph]; }
}
function shed(x, yb) {   // a ship shed: a tiled gable, stone piers, a trireme's stern in the dark, a slipway
