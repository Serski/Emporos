<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhodes, Isometric</title>
<meta name="description" content="A sample of the harbour at Rhodes as an isometric pixel-art block, black outlines and bright flat colours, for Emporos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --glaze: #16100c; --line: #4b3727; --line-soft: #34261b;
  --clay: #d97b46; --bone: #f2e6cb; --bone-dim: #bba887;
  --font-pixel: "Pixelify Sans", ui-monospace, "Courier New", monospace;
  --font-story: "Literata", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; font-variant-ligatures: none; }
html, body { margin: 0; background: var(--glaze); color: var(--bone); }
body { font: 16px/1.5 var(--font-story); -webkit-font-smoothing: antialiased; }
main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { margin: 0; font: 700 30px/1.1 var(--font-pixel); letter-spacing: 0.03em; }
.sub { margin: 6px 0 0; font: 500 13px/1.3 var(--font-pixel); color: var(--bone-dim); letter-spacing: 0.08em; text-transform: uppercase; }
p.lede { max-width: 40em; margin: 14px 0 0; }
figure { margin: 24px 0 0; }
.frame { position: relative; max-width: 100%; margin: 0 auto; border: 2px solid var(--line); background: #ffffff; line-height: 0; }
canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
figcaption { max-width: 40em; margin: 10px auto 0; font-size: 15px; color: var(--bone-dim); }
</style>
</head>
<body>
<main>
  <h1>Rhodes, isometric</h1>
  <p class="sub">Emporos · art sample · a block of the harbour</p>
  <p class="lede">The harbour as a little cut-out block of the world, seen from above at an angle: black outlines, bright flat colours, three shades to every solid, and as many small people and goings-on as will fit.</p>
  <figure>
    <div class="frame" id="isoBox"><canvas id="iso" width="288" height="216" role="img" aria-label="An isometric block of the harbour at Rhodes: the temple of Apollo on its rock, white houses with red roofs, the Sun-god's bronze feet in a scaffold with a crane, seven market stalls on the quay, Elpis in the water, a tower on the mole, and people, a donkey, a cat and gulls."></canvas></div>
    <figcaption>288 × 216 art pixels. Everything is still drawn in code: the buildings, the ship and the quay are built from small cubes, and the people are tiny sprites.</figcaption>
  </figure>
</main>
<script>
'use strict';
// ---------- colour ----------
const RGBC = new Map();
function rgb(c) { let v = RGBC.get(c); if (!v) { const n = parseInt(c.slice(1), 16); v = [n >> 16 & 255, n >> 8 & 255, n & 255]; RGBC.set(c, v); } return v; }
const hx = (r, g, b) => '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
function mix(a, b, t) { const A = rgb(a), B = rgb(b); return hx(Math.round(A[0] + (B[0] - A[0]) * t), Math.round(A[1] + (B[1] - A[1]) * t), Math.round(A[2] + (B[2] - A[2]) * t)); }
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const h3 = (x, y, z) => hash(x * 12.9898 + y * 78.233 + z * 37.719);
// A solid's three faces: the top in full light, the left in half, the right in shade.
const mat = (top, k1, k2) => ({ t: top, l: mix(top, '#2a2850', k1 == null ? 0.16 : k1), r: mix(top, '#2a2850', k2 == null ? 0.34 : k2) });
const INK = '#16141c';
const M = {
  stone: mat('#f2dca8'), stoneD: mat('#d8bc84'), quay: mat('#ead6a6'), earth: mat('#b8865a', 0.2, 0.38), rock: mat('#d6c49c', 0.18, 0.36),
  water: mat('#46b4e8', 0.18, 0.32), deep: mat('#2a8ad0', 0.18, 0.32),
  white: mat('#ffffff', 0.1, 0.24), cream: mat('#fff2d4', 0.12, 0.26), ochre: mat('#ffd890', 0.14, 0.3), pink: mat('#ffc8b4', 0.14, 0.3), blueW: mat('#c8e4ff', 0.12, 0.28),
  roof: mat('#ee6a3a', 0.14, 0.3), roofD: mat('#c8522c', 0.12, 0.28),
  marble: mat('#ffffff', 0.08, 0.2), bronze: mat('#ffb44a', 0.2, 0.4), wood: mat('#c88a4e', 0.18, 0.36), woodD: mat('#8a5a32', 0.2, 0.38),
  hull: mat('#7a4a2a', 0.18, 0.36), band: mat('#e8483a', 0.16, 0.32), pitch: mat('#3a2e34', 0.1, 0.2), deck: mat('#d8a868', 0.12, 0.3),
  green: mat('#6ac84a', 0.18, 0.36), cypress: mat('#2e8a4a', 0.2, 0.38), linen: mat('#fffaf0', 0.1, 0.22), iron: mat('#6a6a7a', 0.14, 0.3),
};
// ---------- the world, in small cubes ----------
const CW = 288, CH = 216, OX = 118, OY = 68;
const V = new Map();
let NEXT_ID = 1;
const vk = (x, y, z) => ((x + 64) << 16) | ((y + 64) << 8) | (z + 64);
function put(x, y, z, m, id) { V.set(vk(x, y, z), { x, y, z, t: m.t, l: m.l, r: m.r, id }); }
function get(x, y, z) { return V.get(vk(x, y, z)); }
function del(x, y, z) { V.delete(vk(x, y, z)); }
function box(x0, y0, z0, w, d, h, m, id) { id = id || NEXT_ID++; for (let x = x0; x < x0 + w; x++) for (let y = y0; y < y0 + d; y++) for (let z = z0; z < z0 + h; z++) put(x, y, z, typeof m === 'function' ? m(x, y, z) : m, id); return id; }
function face(x, y, z, side, c) { const v = get(x, y, z); if (v) v[side] = c; }   // paint one face of one cube: a window, a door, a stripe

// A house: white or coloured walls, windows and a door on the two faces we see, and a red roof or a flat one.
function house(x0, y0, z0, w, d, h, wall, opts) {
  opts = opts || {};
  const id = box(x0, y0, z0, w, d, h, wall);
  const yF = y0 + d - 1, xF = x0 + w - 1, WIN = '#2a3050', WINL = '#3a4a78';
  for (let z = z0 + 2; z < z0 + h - 1; z += 3) {
    for (let x = x0 + 1; x < xF; x += 2 + ((x + z) % 3 === 0 ? 1 : 0)) if (h3(x, yF, z) < 0.75) { face(x, yF, z, 'l', WIN); if (z + 1 < z0 + h - 1) face(x, yF, z + 1, 'l', WINL); }
    for (let y = y0 + 1; y < yF; y += 2 + ((y + z) % 3 === 0 ? 1 : 0)) if (h3(xF, y, z) < 0.7) { face(xF, y, z, 'r', WIN); if (z + 1 < z0 + h - 1) face(xF, y, z + 1, 'r', '#1e2440'); }
  }
  const dx = x0 + 1 + Math.floor(h3(x0, y0, 9) * Math.max(1, w - 3));
  face(dx, yF, z0, 'l', opts.door || '#3a6ab4'); face(dx, yF, z0 + 1, 'l', opts.door || '#3a6ab4');
  if (opts.flat) {   // a flat roof with a low parapet, and something on it
    for (let x = x0; x < x0 + w; x++) for (let y = y0; y < y0 + d; y++) if (x === x0 || y === y0 || x === xF || y === yF) put(x, y, z0 + h, wall, id);
    return id;
  }
  const rm = opts.roof || M.roof, along = opts.alongY ? 'y' : 'x';
  for (let k = 0; ; k++) {   // a pitched roof, course by course, with its gable end painted like the wall
    const a = along === 'x' ? [y0 + k, yF - k] : [x0 + k, xF - k];
    if (a[0] > a[1]) break;
    for (let x = along === 'x' ? x0 - 1 : a[0]; x <= (along === 'x' ? xF + 1 : a[1]); x++) for (let y = along === 'x' ? a[0] : y0 - 1; y <= (along === 'x' ? a[1] : yF + 1); y++) {
      put(x, y, z0 + h + k, rm, id);
      if (along === 'x' && x === xF + 1 && y > a[0] && y < a[1]) face(x, y, z0 + h + k, 'r', wall.r);
      if (along === 'y' && y === yF + 1 && x > a[0] && x < a[1]) face(x, y, z0 + h + k, 'l', wall.l);
    }
  }
  return id;
}
function temple(x0, y0, z0) {   // Apollo: three steps, a ring of columns, a painted frieze, a red roof with white gables
  const w = 22, d = 10, id = NEXT_ID++;
  for (let s = 0; s < 2; s++) box(x0 - 2 + s, y0 - 2 + s, z0 + s, w + 4 - 2 * s, d + 4 - 2 * s, 1, M.marble, id);
  const zc = z0 + 2, hc = 7;
  box(x0 + 2, y0 + 2, zc, w - 4, d - 4, hc, mat('#f4e8d8', 0.3, 0.5), id);   // the cella, in shadow
  for (let x = x0; x < x0 + w; x += 2) for (const y of [y0, y0 + d - 1]) box(x, y, zc, 1, 1, hc, M.marble, id);
  for (let y = y0; y < y0 + d; y += 2) for (const x of [x0, x0 + w - 1]) box(x, y, zc, 1, 1, hc, M.marble, id);
  box(x0, y0, zc + hc, w, d, 2, M.marble, id);
  for (let x = x0; x < x0 + w; x++) face(x, y0 + d - 1, zc + hc, 'l', x % 2 ? '#3a64c8' : '#e8483a');
  for (let y = y0; y < y0 + d; y++) face(x0 + w - 1, y, zc + hc, 'r', y % 2 ? '#2a4aa0' : '#b83a2e');
  for (let k = 0; k * 2 < d; k++) for (let x = x0 - 1; x <= x0 + w; x++) for (let y = y0 + k; y <= y0 + d - 1 - k; y++) {
    put(x, y, zc + hc + 2 + k, k === Math.floor((d - 1) / 2) ? M.roofD : M.roof, id);
    if (x === x0 + w && y > y0 + k && y < y0 + d - 1 - k) face(x, y, zc + hc + 2 + k, 'r', '#f0f0f8');
  }
  return id;
}
function colossus(x0, y0) {   // the Sun-god's bronze feet on a marble base, a scaffold, a crane and a furnace
  const id = box(x0, y0, 0, 12, 10, 5, M.marble);
  for (let x = x0; x < x0 + 12; x++) face(x, y0 + 9, 2, 'l', '#e8e8f0');
  const br = NEXT_ID++;
  for (const fx of [x0 + 2, x0 + 7]) { box(fx, y0 + 3, 5, 3, 6, 1, M.bronze, br); box(fx, y0 + 3, 6, 3, 3, 6, M.bronze, br); put(fx + 1, y0 + 4, 12, M.iron, br); put(fx + 1, y0 + 4, 13, M.iron, br); }
  const sc = NEXT_ID++;
  for (const [x, y] of [[x0 - 1, y0 - 1], [x0 + 12, y0 - 1], [x0 - 1, y0 + 10], [x0 + 12, y0 + 10]]) box(x, y, 0, 1, 1, 18, M.wood, sc);
  for (const z of [11, 17]) { for (let x = x0 - 1; x <= x0 + 12; x++) { put(x, y0 - 1, z, M.wood, sc); put(x, y0 + 10, z, M.wood, sc); } for (let y = y0 - 1; y <= y0 + 10; y++) { put(x0 - 1, y, z, M.wood, sc); put(x0 + 12, y, z, M.wood, sc); } }
  for (let y = y0 + 4; y < y0 + 10; y++) for (let k = 0; k < 6 - (y - y0 - 4); k++) put(x0 + 12 + k, y, 0 + Math.floor(k * 0) , M.earth, NEXT_ID);   // a heap of earth
  const cr = NEXT_ID++;
  box(x0 + 15, y0 + 4, 0, 1, 1, 28, M.woodD, cr);
  for (let x = x0 + 4; x <= x0 + 15; x++) put(x, y0 + 4, 28, M.woodD, cr);
  box(x0 + 13, y0 + 2, 0, 3, 5, 3, M.wood, cr);   // the treadwheel's housing
  const fu = box(x0 - 5, y0 + 7, 0, 3, 3, 3, mat('#c8724a', 0.18, 0.36)); box(x0 - 4, y0 + 8, 3, 1, 1, 3, mat('#a85a3a'), fu);
  face(x0 - 4, y0 + 9, 0, 'l', '#ffb030'); face(x0 - 4, y0 + 9, 1, 'l', '#ff7a20');
  return { crane: [x0 + 4, y0 + 4, 28], chimney: [x0 - 4, y0 + 8, 6] };
}
function ship(xs, xe, yc) {   // Elpis: a hull of strakes, a painted band, an eye, a goose-neck, a mast and a furled sail
  const id = NEXT_ID++, hw = x => Math.max(0, Math.round(4.4 * Math.min(1, (x - xs) / 5, (xe - x) / 8)));
  for (let x = xs; x <= xe; x++) {
    const w = hw(x);
    for (let y = yc - w; y <= yc + w; y++) for (let z = -3; z <= 2; z++) {
      const edge = Math.abs(y - yc) === w || x === xs || x === xe;
      if (!edge && z < 1) continue;
      if (!edge && z === 2) continue;
      put(x, y, z, z === 2 ? M.wood : z === 1 && !edge ? M.deck : z === 1 ? M.band : z === 0 ? M.hull : z === -1 ? M.hull : M.pitch, id);
    }
  }
  for (const [x, z] of [[xs, 3], [xs, 4], [xs - 1, 5], [xs - 1, 6], [xs - 1, 7], [xs, 8], [xs + 1, 8], [xs + 2, 7]]) put(x, yc, z, M.wood, id);   // the goose-neck
  put(xe + 1, yc, 2, M.wood, id); put(xe + 1, yc, 3, M.wood, id); put(xe + 2, yc, 4, M.wood, id);
  face(xe - 6, yc + hw(xe - 6), 1, 'l', '#ffffff'); face(xe - 5, yc + hw(xe - 5), 1, 'l', '#16141c');   // the eye
  const mx = Math.round((xs + xe) / 2) - 2;
  box(mx, yc, 2, 1, 1, 15, M.woodD, id);
  for (let x = mx - 10; x <= mx + 10; x++) { put(x, yc, 16, M.wood, id); if (Math.abs(x - mx) < 10) { put(x, yc, 15, M.linen, id); put(x, yc, 14, M.linen, id); } }   // the yard, swung fore and aft in harbour, with the sail furled on it
  for (let x = mx - 8; x <= mx + 8; x += 4) { face(x, yc, 14, 'l', '#c8a878'); face(x, yc, 15, 'l', '#c8a878'); face(x, yc, 15, 't', '#e8d8b8'); }
  for (let k = 0; k < 7; k++) { put(xs + 3 - Math.floor(k / 2), yc + 5, 2 - k, M.woodD, id); }   // the steering oar
  for (let x = mx + 3; x < mx + 14; x += 2) { put(x, yc - 1, 2, mat('#e8763a'), id); put(x, yc + 1, 2, mat('#e8763a'), id); put(x, yc + 1, 3, mat('#e8763a'), id); }   // jars in the hold
  box(mx - 10, yc - 1, 2, 4, 3, 1, mat('#e8c47a'), id);   // sacks
  return { mx, top: [mx, yc, 17], bow: [xe + 2, yc, 4], stern: [xs - 1, yc, 8] };
}
function stall(x0, y0, robe, kind) {   // two posts at the back, a striped awning over the keeper's head, a counter in front
  const id = NEXT_ID++, wd = mat('#b47a44', 0.18, 0.36);
  for (const [x, y] of [[x0, y0], [x0 + 7, y0]]) box(x, y, 0, 1, 1, 9, wd, id);
  const stripe = mat(robe, 0.16, 0.32);
  for (let x = x0 - 1; x <= x0 + 8; x++) for (let y = y0 - 1; y <= y0 + 2; y++) put(x, y, 9, (x - x0 + 10) % 4 < 2 ? stripe : M.linen, id);
  for (let x = x0 - 1; x <= x0 + 8; x++) if ((x - x0 + 10) % 4 < 2) face(x, y0 + 2, 9, 'l', mix(robe, '#2a2850', 0.3));
  const G2 = { wine: [mat('#e8763a'), 2], sponge: [mat('#ffd040'), 1], cups: [mat('#3a3440'), 1], bolt: [mat('#9a6a3a'), 1], stores: [mat('#e8c47a'), 2], works: [M.marble, 2], bank: [mat('#e0e4ec'), 1] }[kind];
  if (G2) for (let x = x0 + 1; x <= x0 + 6; x++) if ((x - x0) % 2 === 1 || kind === 'bolt' || kind === 'works') for (let z = 3; z < 3 + G2[1]; z++) put(x, y0 + 4, z, kind === 'bank' && z === 3 && x % 2 ? mat('#ffd040') : G2[0], id);
  for (let x = x0 + 1; x <= x0 + 6; x++) { put(x, y0 + 4, 0, wd, id); put(x, y0 + 4, 1, mat(robe, 0.16, 0.32), id); put(x, y0 + 4, 2, M.deck, id); face(x, y0 + 4, 1, 'l', x % 2 ? mix(robe, '#ffffff', 0.4) : robe); }
  return id;
}

// ---------- the block ----------
const NX = 80, NY = 56, SEA = 38;
const ground = NEXT_ID++, water = NEXT_ID++;
for (let x = 0; x < NX; x++) for (let y = 0; y < NY; y++) {
  if (y < SEA) {   // the quay: paving on top, coursed stone below
    for (let z = -3; z < 0; z++) { const st = (Math.floor((x + (z % 2 ? 2 : 0)) / 4) + z) % 2 ? M.stone : M.stoneD; put(x, y, z, z === -1 ? ((Math.floor(x / 3) + Math.floor(y / 3)) % 2 ? M.quay : mat('#e2cc98')) : st, ground); }
  } else {
    put(x, y, -3, M.deep, water); put(x, y, -2, M.water, water);
  }
}
for (let x = 64; x < 76; x++) for (let y = SEA; y < 54; y++) for (let z = -3; z < 0; z++) put(x, y, z, z === -1 ? M.quay : (x + z) % 4 < 2 ? M.stone : M.stoneD, ground);   // the mole
// the rock of the acropolis, and the temple of Apollo on it
box(0, 0, 0, 26, 13, 9, (x, y, z) => (x * 3 + y + z * 5) % 7 === 0 ? mat('#c8b48a') : M.rock);
for (let x = 0; x < 26; x++) for (let y = 0; y < 13; y++) put(x, y, 8, (x + y) % 5 === 0 ? mat('#8ac85a') : mat('#b8d878'), get(0, 0, 0).id);
temple(2, 1, 9);
for (const [x, y, h] of [[24, 2, 6], [23, 10, 5], [1, 11, 4]]) box(x, y, 9, 1, 1, h, M.cypress);
// a terrace of houses below the rock, and a row in front
box(26, 0, 0, 26, 12, 3, M.rock);
for (let x = 26; x < 52; x++) for (let y = 0; y < 12; y++) put(x, y, 2, mat('#b8d878'), get(26, 0, 0).id);
house(27, 1, 3, 7, 7, 9, M.white); house(35, 2, 3, 6, 8, 7, M.ochre, { alongY: true }); house(42, 1, 3, 8, 7, 10, M.white, { flat: true });
for (const [x, y, c] of [[43, 2, '#ff4a6a'], [45, 2, '#ffd040'], [47, 3, '#ff4a6a'], [44, 6, '#6ac84a'], [48, 6, '#ff8a3a']]) put(x, y, 13, mat(c), NEXT_ID++);   // pots of flowers on the roof box(50, 4, 3, 1, 1, 7, M.cypress);
house(0, 14, 0, 8, 8, 10, M.white); house(9, 14, 0, 7, 9, 8, M.pink, { alongY: true }); house(17, 15, 0, 9, 8, 11, M.white, { door: '#c8483a' }); house(27, 14, 0, 7, 9, 9, M.cream, { flat: true }); house(35, 14, 0, 8, 8, 12, M.white); house(44, 15, 0, 6, 8, 8, M.blueW, { alongY: true });
box(43, 23, 0, 2, 2, 3, M.green); box(26, 23, 0, 1, 1, 6, M.cypress);
// the Sun-god's works, beside the city
const COL = colossus(55, 4);
// the tower at the end of the mole
const tw = box(66, 45, 0, 8, 8, 16, (x, y, z) => ((x + y) % 4 < 2) === (z % 2 === 0) ? M.stone : M.stoneD);
for (let x = 66; x < 74; x++) for (let y = 45; y < 53; y++) if ((x === 66 || y === 45 || x === 73 || y === 52) && (x + y) % 2 === 0) put(x, y, 16, M.stone, tw);
face(69, 52, 0, 'l', '#4a3a3a'); face(70, 52, 0, 'l', '#4a3a3a'); face(69, 52, 1, 'l', '#4a3a3a'); face(70, 52, 1, 'l', '#4a3a3a');
for (const z of [6, 11]) { face(70, 52, z, 'l', INK); face(73, 48, z, 'r', INK); }
// seven stalls along the quay, in the colours of their keepers
// a line of washing between two houses
{ const lid = NEXT_ID++; for (let x = 8; x <= 16; x++) put(x, 21, 9, mat('#5a4a40', 0.1, 0.2), lid); for (const [x, c] of [[9, '#ff4a6a'], [11, '#ffffff'], [12, '#3a8ad8'], [14, '#ffd040']]) put(x, 21, 8, mat(c), lid); }
const LOOKS = {
  thras: { skin: '#e8a46a', hair: '#3a281c', robe: '#c8324a', beard: true }, korinna: { skin: '#d8905a', hair: '#24180f', robe: '#ffcc6a', veil: '#3a8ad8' },
  aristeia: { skin: '#f0b888', hair: '#c8c0b0', robe: '#5a4a3e', veil: '#3a3430' }, arsenal: { skin: '#c88a58', hair: '#5a4632', robe: '#6a9a3a', beard: true, bald: true },
  stores: { skin: '#e8b07a', hair: '#7a4a22', robe: '#c88a3a', long: true }, works: { skin: '#d8985e', hair: '#2d2018', robe: '#f4ead4', beard: true, hat: true },
  bank: { skin: '#f0b888', hair: '#ffffff', robe: '#2a5aa8', beard: true },
};
const STALLS = ['thras', 'korinna', 'aristeia', 'arsenal', 'stores', 'works', 'bank'];
const KINDS = ['wine', 'sponge', 'cups', 'bolt', 'stores', 'works', 'bank'];
STALLS.forEach((id, i) => stall(2 + i * 9, 27, LOOKS[id].robe, KINDS[i]));
// bollards, a stack of jars, a donkey's cart, crates
for (const x of [12, 58]) box(x, SEA - 1, 0, 1, 1, 2, M.stoneD);
const crates = NEXT_ID++; box(66, 33, 0, 3, 3, 3, M.wood, crates); box(69, 34, 0, 2, 2, 2, M.wood, crates); box(67, 34, 3, 2, 2, 2, mat('#e8c47a'), crates);
// Elpis, in the water
const SHIP = ship(8, 50, 46);

// ---------- drawing the cubes, near over far, then the outlines ----------
const img = new ImageData(CW, CH), depth = new Float32Array(CW * CH).fill(-1e9), idb = new Uint16Array(CW * CH);
function plot(x, y, c, d, id) {
