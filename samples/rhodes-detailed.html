<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhodes, Redrawn</title>
<meta name="description" content="A sample of the harbour at Rhodes drawn in denser, more detailed pixel art, for Emporos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --glaze: #16100c; --glaze-2: #201711; --line: #4b3727; --line-soft: #34261b;
  --clay: #d97b46; --clay-hi: #f2a36d; --bone: #f2e6cb; --bone-dim: #bba887; --gold: #eac05a;
  --font-pixel: "Pixelify Sans", ui-monospace, "Courier New", monospace;
  --font-story: "Literata", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; font-variant-ligatures: none; }
html, body { margin: 0; background: var(--glaze); color: var(--bone); }
body { font: 16px/1.5 var(--font-story); -webkit-font-smoothing: antialiased; }
main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { margin: 0; font: 700 30px/1.1 var(--font-pixel); letter-spacing: 0.03em; }
.sub { margin: 6px 0 0; font: 500 13px/1.3 var(--font-pixel); color: var(--bone-dim); letter-spacing: 0.08em; text-transform: uppercase; }
p.lede { max-width: 40em; margin: 14px 0 0; }
h2 { margin: 30px 0 10px; display: flex; align-items: center; gap: 10px; font: 600 13px/1 var(--font-pixel); letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay); }
h2::after { content: ""; flex: 1; height: 2px; background: var(--line-soft); }
figure { margin: 0; }
.frame { position: relative; max-width: 100%; margin: 0 auto; border: 2px solid var(--line); background: #000; line-height: 0; }
canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
figcaption { max-width: 40em; margin: 10px auto 0; font-size: 15px; color: var(--bone-dim); }
.say {
  position: absolute; left: 3%; right: 3%; bottom: 4%; line-height: 1.4;
  padding: 10px 12px; background: rgba(16, 11, 8, 0.9); border: 2px solid var(--clay);
}
.say b { display: block; font: 600 13px/1.2 var(--font-pixel); letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
.say span { display: block; margin-top: 4px; font: 15px/1.4 var(--font-story); }
@media (max-width: 620px) { .say { position: static; margin-top: 0; border-width: 2px 0 0; } .say span { font-size: 14px; } }
ul.notes { max-width: 40em; margin: 0; padding-left: 1.2em; }
ul.notes li { margin: 4px 0; }
</style>
</head>
<body>
<main>
  <h1>Rhodes, redrawn</h1>
  <p class="sub">Emporos · art sample · spring, 290 BC</p>
  <p class="lede">The same harbour as the game, drawn at about two and a half times the pixels, with shading ramps, coloured outlines, dithering and texture. Everything is still drawn in code.</p>

  <h2>The harbour</h2>
  <figure>
    <div class="frame" id="harbourBox"><canvas id="harbour" width="320" height="180" role="img" aria-label="The harbour at Rhodes in the morning: the city and the temple of Apollo on the hill, the bronze Sun-god going up in his scaffolding, Elpis moored at the quay, and seven stalls along the front."></canvas></div>
    <figcaption>320 × 180 art pixels, against about 130 × 107 in the game now. The houses, the stalls, the ship and the people all have room for light and shadow.</figcaption>
  </figure>

  <h2>A merchant up close</h2>
  <figure>
    <div class="frame" id="stallBox"><canvas id="stall" width="320" height="180" role="img" aria-label="Thrasyllos the wine merchant standing behind a plain wooden counter, under a linen awning, with the harbour behind him."></canvas>
      <div class="say"><b>Thrasyllos · Wine merchant</b><span>“Halicarnassus has Knidian wine, Coan wine and wine of its own. It still buys mine. Think about that.”</span></div>
    </div>
    <figcaption>What tapping a merchant could open: the trader across the counter, with the goods in front of them.</figcaption>
  </figure>
</main>
<script>
'use strict';
// =====================================================================
// Shared pixel tools
// =====================================================================
const RGBC = new Map();
function rgb(c) { let v = RGBC.get(c); if (!v) { const n = parseInt(c.slice(1), 16); v = [n >> 16 & 255, n >> 8 & 255, n & 255]; RGBC.set(c, v); } return v; }
const hx = (r, g, b) => '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
function mix(a, b, t) { const A = rgb(a), B = rgb(b); return hx(Math.round(A[0] + (B[0] - A[0]) * t), Math.round(A[1] + (B[1] - A[1]) * t), Math.round(A[2] + (B[2] - A[2]) * t)); }
const SHADOW = '#2a1f45', LIGHT = '#fff4d6', INK = '#1e1428';
const dk = (c, k) => mix(c, SHADOW, k);   // shadows lean cool and purple
const lt = (c, k) => mix(c, LIGHT, k);    // light leans warm
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const h2 = (x, y) => hash(x * 12.9898 + y * 78.233);
function vnoise(x, s) { const i = Math.floor(x), f = x - i, a = hash(i + s * 57.3), b = hash(i + 1 + s * 57.3), u = f * f * (3 - 2 * f); return a + (b - a) * u; }
const fbm = (x, s) => vnoise(x, s) * 0.6 + vnoise(x * 2.3, s + 3) * 0.28 + vnoise(x * 5.1, s + 7) * 0.12;
function vnoise2(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);

}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bay = (x, y) => (BAYER[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
// Pick from a ramp by t in 0..1. Each step is solid, then dithers into the next over its last `soft` part.
function rampAt(ramp, t, x, y, soft) {

let G = null;
function R(x, y, w, h, c) { if (w <= 0 || h <= 0) return; G.fillStyle = c; G.fillRect(Math.floor(x), Math.floor(y), Math.round(w), Math.round(h)); }

function line(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;

}
function sag(x0, y0, x1, y1, drop, c) {   // a rope hanging between two points
  const n = Math.max(2, Math.round(Math.abs(x1 - x0) + Math.abs(y1 - y0)));
  let px_ = null, py_ = null;

function canvasOf(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function paint(c, fn) { const prev = G; G = c.getContext('2d'); fn(G); G = prev; return c; }
// A sprite with an outline that takes the colour of whatever it wraps, darkened: the "selective outline" of modern pixel art.
function spr(w, h, fn, k) { const c = canvasOf(w, h); paint(c, fn); if (k) selout(c, k); return c; }

    for (const [dx, dy] of [[0, -1], [-1, 0], [1, 0], [0, 1]]) {

      const j = (Y * w + X) * 4;
      if (!a[j + 3]) continue;

// A turned pot, one row per width, lit from the right.
function vessel(cx, yTop, widths, ramp) {
  widths.forEach((w, j) => {
    if (!w) return;
    const x0 = Math.round(cx - w / 2);
    for (let i = 0; i < w; i++) {
      const t = (i + 0.5) / w, n = ramp.length;
      const k = t < 0.2 ? n - 1 : t < 0.45 ? n - 2 : t > 0.82 && w > 2 ? 0 : t > 0.6 ? 1 : 2;

// =====================================================================
// Palettes
// =====================================================================
const SKY = ['#2b5ea6', '#3669b1', '#4277bd', '#5087c8', '#6198d2', '#76aada', '#8dbbe2', '#a6cae8', '#bed8ea', '#d2e3ea', '#e3ebe6'];
const CLOUD = ['#98aecb', '#b2c5dc', '#cad9e8', '#e2ebf3', '#f6f9fb', '#ffffff'];
const SEA = ['#aad6e3', '#8ecbe0', '#74bcd9', '#5daccf', '#4a9bc5', '#3a8aba', '#2e79ad', '#25699f', '#1e5a91', '#194d84'];
const GROUND = ['#e8d6a2', '#dbc790', '#cbb57e', '#b9a26c', '#a48e5c', '#8a784e', '#6f6142'];
const STONE = ['#f7eed8', '#eadcbe', '#dccaa6', '#c9b48e', '#b19b76', '#94805f', '#73624a', '#54473a'];
const MARBLE = ['#fffdf6', '#f6f0e3', '#e7ddca', '#d2c6ae', '#b7aa91', '#988b73'];
const BRONZE = ['#ffe2a6', '#f2bb6c', '#d4954c', '#ad6d36', '#7e4b26', '#523018'];
const WOOD = ['#d6a46a', '#b78452', '#946640', '#73492e', '#553320', '#3a2216'];
const WALLS = ['#f4ecd8', '#ecdcba', '#e4d0a8', '#f7f1e4', '#e9d4ae', '#dfc9a2', '#f0e2c4'];
const ROOFS = ['#cf6a3c', '#bd5c35', '#d77d4c', '#ad522f', '#c46440'];
const CREAM = '#efe3cc';

// =====================================================================
// The harbour at Rhodes
// =====================================================================
const W = 320, H = 180, HZ = 90, SHORE = 102, QY = 141, GY = 176, WL = 131;
const waterTop = new Int16Array(W).fill(HZ);   // the first row of open water in each column, for reflections and waves

const skyAt = (x, y) => rampAt(SKY, y / (HZ - 1), x, y, 0.38);
function paintSky() {
  for (let y = 0; y < HZ; y++) for (let x = 0; x < W; x++) P(x, y, skyAt(x, y));
  const sx = 266, sy = 24;   // the morning sun, with rings of dithered glow
  for (let y = sy - 20; y <= sy + 20; y++) for (let x = sx - 20; x <= sx + 20; x++) {
    const d = Math.hypot(x - sx, y - sy);
    if (d <= 5.2) P(x, y, d < 3.9 ? '#fffef7' : '#fff6d4');
    else if (d < 8.5) { if (bay(x, y) < 0.75) P(x, y, '#fdf0c6'); else P(x, y, lt(skyAt(x, y), 0.5)); }
    else if (d < 13) { if (bay(x, y) < 0.5) P(x, y, lt(skyAt(x, y), 0.36)); }

}
function cloudSprite(puffs) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9;

  return spr(w, h, () => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const X = x + x0, Y = y + y0;
      if (Y > base) continue;
      let lit = -9;
      for (const [cx, cy, r] of puffs) { const dx = X - cx, dy = Y - cy; if (dx * dx + dy * dy <= r * r) lit = Math.max(lit, (dx * 0.55 - dy * 0.85) / r); }

const CLOUDS = [
  { s: cloudSprite([[0, 10, 7], [9, 6, 9], [20, 8, 8], [30, 11, 6], [-8, 13, 4], [37, 13, 4]]), x: 70, y: 9, v: 0.9 },
  { s: cloudSprite([[0, 6, 4], [7, 4, 6], [15, 6, 5], [21, 8, 3]]), x: 168, y: 30, v: 0.6 },
  { s: cloudSprite([[0, 5, 3], [6, 3, 5], [13, 5, 4]]), x: 300, y: 50, v: 0.45 },
  { s: cloudSprite([[0, 8, 5], [8, 5, 7], [18, 7, 6], [26, 9, 4]]), x: 222, y: 58, v: 0.35 },
];

function paintSea() {   // the far shore of Asia across the strait, and the water
  for (let x = 0; x < W; x++) {
    const f = smooth(110, 190, x), hb = Math.round(HZ - (3 + 12 * fbm(x / 40, 4)) * f), lit = fbm((x + 1) / 40, 4) < fbm(x / 40, 4);
    for (let y = hb; y < HZ; y++) P(x, y, (y - hb) / Math.max(1, HZ - hb) > 0.55 && bay(x, y) < 0.5 ? '#b9cfdd' : lit ? '#adc4d6' : '#9eb7cc');
    const hf = Math.round(HZ - (1 + 5 * fbm(x / 15, 8)) * f), lf = fbm((x + 1) / 15, 8) < fbm(x / 15, 8);

  }
  for (let y = HZ; y < H; y++) {
    const t = Math.pow((y - HZ) / (QY - HZ), 0.85);
    for (let x = 0; x < W; x++) P(x, y, rampAt(SEA, t, x, y, 0.4));
  }
  R(0, HZ, W, 1, '#cde7ee');

  for (let k = 0; k < 230; k++) {
    const y = HZ + 2 + Math.floor(Math.pow(r(), 0.8) * (QY - HZ)), d = (y - HZ) / (QY - HZ), len = 2 + Math.floor(r() * (2 + d * 9)), x = Math.floor(r() * W);

const hillTop = x => x > 210 ? 999 : Math.round(43 + 3 * fbm(x / 13, 2) + (SHORE - 3 - 45) * smooth(48, 214, x));
function groundAt(x, y) { const n = vnoise2(x / 7, y / 5, 3) * 0.6 + vnoise2(x / 2.5, y / 2.5, 9) * 0.4; return rampAt(GROUND, 0.12 + n * 0.55, x, y, 0.5); }
function blob(x, y, w, h, base, seed) {   // a clump of leaves, lit from the upper right

      if (a > b) break;

      R(x + w, top - j, sw, 1, j < gh ? roof : lt(roof, 0.2));   // the roof's long slope over the side
    }
    R(x, top, w, 1, wallS); P(x + (w >> 1), top - 2, win);
  } else {   // the eaves face us: a row of tiles, the ridge, and a hip at the lit end
    R(x - 1, top - 1, w + sw + 1, 1, dk(roof, 0.38));
    R(x - 1, top - 2, w + sw + 1, 1, roof);
    R(x, top - 3, w + sw - 1, 1, lt(roof, 0.16));
    for (let i = x - 1; i < x + w + sw; i += 2) P(i, top - 2, dk(roof, 0.16));

function temple(cx, yb) {   // Apollo on the acropolis: steps, nine columns, a pediment and a red roof

  for (let s = 0; s < 3; s++) { const y = yb - 2 * s - 2, ins = 3 - s; R(x0 - ins, y, w + ins * 2, 1, M[1]); R(x0 - ins, y + 1, w + ins * 2, 1, M[3]); P(x0 - ins + w + ins * 2 - 1, y, M[0]); }
  R(x0 + 1, top + 1, w - 2, yb - 7 - top, M[4]); R(x0 + 1, top + 1, w - 2, 2, M[5]);
  R(cx - 3, yb - 15, 6, 9, '#7a6a5a'); R(cx - 2, yb - 14, 4, 8, '#54463c'); P(cx + 1, yb - 14, '#6a5a4c');
  for (let i = 0; i < 9; i++) {
    const x = Math.round(x0 + 1 + i * (w - 5) / 8), hgt = yb - 8 - top;
