<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhodes, Flat</title>
<meta name="description" content="A sample of the harbour at Rhodes and its merchants in clean, flat pixel art, for Emporos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --glaze: #16100c; --line: #4b3727; --line-soft: #34261b;
  --clay: #d97b46; --bone: #f2e6cb; --bone-dim: #bba887; --gold: #eac05a;
  --font-pixel: "Pixelify Sans", ui-monospace, "Courier New", monospace;
  --font-story: "Literata", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; font-variant-ligatures: none; }
html, body { margin: 0; background: var(--glaze); color: var(--bone); }
body { font: 16px/1.5 var(--font-story); -webkit-font-smoothing: antialiased; }
main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { margin: 0; font: 700 30px/1.1 var(--font-pixel); letter-spacing: 0.03em; }
.sub { margin: 6px 0 0; font: 500 13px/1.3 var(--font-pixel); color: var(--bone-dim); letter-spacing: 0.08em; text-transform: uppercase; }
p.lede { max-width: 40em; margin: 14px 0 0; }
h2 { margin: 30px 0 10px; display: flex; align-items: center; gap: 10px; font: 600 13px/1 var(--font-pixel); letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay); }
h2::after { content: ""; flex: 1; height: 2px; background: var(--line-soft); }
figure { margin: 0; }
.frame { position: relative; max-width: 100%; margin: 0 auto; border: 2px solid var(--line); background: #000; line-height: 0; }
canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
figcaption { max-width: 40em; margin: 10px auto 0; font-size: 15px; color: var(--bone-dim); }
.names { display: grid; grid-template-columns: repeat(8, 1fr); margin: 8px auto 0; font: 500 12px/1.2 var(--font-pixel); color: var(--bone-dim); text-align: center; letter-spacing: 0.04em; }
.names b { display: block; color: var(--bone); font-weight: 600; }
@media (max-width: 620px) { .names { font-size: 10px; } }
</style>
</head>
<body>
<main>
  <h1>Rhodes, flat</h1>
  <p class="sub">Emporos · art sample · spring, 290 BC</p>
  <p class="lede">The game's own flat look, a step bigger and cleaner: people about 22 pixels tall instead of 11, two or three flat shades to each colour, soft colours, no outlines and no dithering.</p>

  <h2>The harbour</h2>
  <figure>
    <div class="frame" id="harbourBox"><canvas id="harbour" width="224" height="126" role="img" aria-label="The harbour at Rhodes in flat pixel art: the town and temple on the hill, the Sun-god's feet in the scaffold, Elpis at the quay, and seven merchants standing by their stalls."></canvas></div>
    <figcaption>224 × 126 art pixels, against about 140 × 80 in the game now. Each merchant stands by their own table under a plain awning.</figcaption>
  </figure>

  <h2>The merchants of Rhodes</h2>
  <figure>
    <div class="frame" id="castBox"><canvas id="cast" width="176" height="32" role="img" aria-label="The seven merchants of Rhodes and Ariston, standing in a row."></canvas></div>
    <div class="names" id="names">
      <span><b>Thrasyllos</b>wine</span><span><b>Korinna</b>sponges</span><span><b>Aristeia</b>cups</span><span><b>Damagetos</b>arsenal</span><span><b>Myrto</b>stores</span><span><b>Aristokles</b>the statue</span><span><b>Antimachos</b>banker</span><span><b>Ariston</b>you</span>
    </div>
    <figcaption>Each one is built from the look the game already gives them: skin, hair, beard, robe and trim.</figcaption>
  </figure>
</main>
<script>
'use strict';
// ---------- tools ----------
const RGBC = new Map();
function rgb(c) { let v = RGBC.get(c); if (!v) { const n = parseInt(c.slice(1), 16); v = [n >> 16 & 255, n >> 8 & 255, n & 255]; RGBC.set(c, v); } return v; }
const hx = (r, g, b) => '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);

const dk = (c, k) => mix(c, '#3a3060', k), lt = (c, k) => mix(c, '#fff8e8', k);   // soft shadows lean blue-violet, light leans warm
let G = null;

function line(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx + dy; G.fillStyle = c;
  for (let i = 0; i < 400; i++) { G.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
}
function canvasOf(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---------- a soft, flat palette ----------

  far: '#b4c1dc', far2: '#a3b2d2', sea: ['#88c7df', '#70b7d6', '#5ba7cc', '#4c98c1'], wave: '#c2e5f0', seaS: '#4a8fba',
  hill: '#dfcb98', hillS: '#cdb680', scrub: '#a0ac64', scrubS: '#84944f', cyp: '#4f7b4f', cypS: '#3b5f3e',
  wallF: '#f4ecdc', wallS: '#dccdb0', roof: '#d47c52', roofS: '#b4603e', win: '#5c4846',
  stone: '#e6d8b8', stoneL: '#f3e9d2', stoneS: '#cbbb98', stoneJ: '#b9a786', marble: '#fbf8f0', marbleS: '#e2dbca',
  bronze: '#e2a65a', bronzeS: '#b47a3e', wood: '#b4844f', woodS: '#8a5e38', woodD: '#6a4428', linen: '#f3ead6', linenS: '#dccfb4',
  quay: '#ebe0c6', quayS: '#ddd0b2', quayJ: '#c9ba98', hull: '#7e5132', hullS: '#5a3822', band: '#c45a3a', rail: '#cf9c62',
};

// ---------- people: a whole figure about 22 pixels tall, facing a little to the right ----------
const LOOKS = {
  thras: { skin: '#c48a58', hair: '#3a281c', style: 'short', beard: 2, robe: '#8b3240', trim: '#ead7ae' },
  korinna: { skin: '#b97f50', hair: '#24180f', style: 'veil', veil: '#3f6f8e', beard: 0, robe: '#d2b27a', trim: '#8a5a34', f: true },
  aristeia: { skin: '#cf9a6a', hair: '#bfb7aa', style: 'veil', veil: '#4a4038', beard: 0, robe: '#5a4a3e', trim: '#c8623a', f: true },
  arsenal: { skin: '#b07a4c', hair: '#5a4632', style: 'bald', beard: 1, robe: '#5f6b4a', trim: '#d9a441' },
  stores: { skin: '#c99468', hair: '#6b4a2e', style: 'long', beard: 0, robe: '#9a6a3a', trim: '#efe3cc', f: true },
  works: { skin: '#b88252', hair: '#2d2018', style: 'curly', beard: 2, robe: '#e9dcc0', trim: '#b0773a', hat: 'pilos' },
  bank: { skin: '#c99a6c', hair: '#d8d2c4', style: 'short', beard: 1, robe: '#2f4a6a', trim: '#e3b453' },

function person(L, blink) {

    if (!fem) { R(5, o + 16, 8, 3, rb); R(5, o + 16, 2, 3, rbS); R(12, o + 16, 1, 2, rbL); R(5, o + 18, 8, 1, trS); }

    } else {
      R(5, o + 1, 7, 2, hr); R(8, o + 1, 3, 1, hrL); R(5, o + 3, 2, 2, hr); P(5, o + 5, hr); P(11, o + 3, hrS);
      if (st === 'curly') { P(6, o, hr); P(8, o, hr); P(10, o, hrL); P(4, o + 2, hr); P(4, o + 4, hr); }
      if (st === 'long') { R(3, o + 3, 3, 9, hr); R(3, o + 3, 1, 9, hrS); P(4, o + 12, hrS); }
    }

    if (L.f && st === 'veil') P(6, o + 6, '#e3b453');
    if (L.beard === 1) { R(6, o + 7, 6, 2, hr); P(10, o + 7, '#7a3a30'); P(11, o + 7, hrL); }
    if (L.beard === 2) { R(6, o + 6, 6, 3, hr); R(7, o + 9, 4, 1, hr); P(10, o + 7, '#5a2a24'); P(11, o + 6, hrL); P(9, o + 6, hrL); }

  });
}
const FIG = {}; for (const id in LOOKS) FIG[id] = [person(LOOKS[id], false), person(LOOKS[id], true)];

// ---------- the harbour ----------
const W = 224, H = 126, HZ = 62, SHORE = 70, QY = 96, WL = 88;
const hillY = x => Math.round(30 + 36 * smooth(36, 142, x));
function cloud(x, y, w) { R(x + 3, y, w - 9, 2, K.cloud); R(x + w - 9, y - 1, 5, 1, K.cloud); R(x, y + 2, w, 3, K.cloud); R(x + 1, y + 5, w - 2, 1, K.cloudS); R(x + 4, y - 1, 4, 1, K.cloud); }
function paintBack() {
  K.sky.forEach((c, i) => R(0, i * 16, W, 16, c)); R(0, 48, W, HZ - 48, K.sky[3]);
  for (let y = -9; y <= 9; y++) for (let x = -9; x <= 9; x++) { const d = Math.hypot(x, y); if (d <= 6.4) P(192 + x, 18 + y, K.sun); else if (d <= 8.6) P(192 + x, 18 + y, K.sunRing); }
  for (let x = 96; x < W; x++) { const top = Math.round(HZ - (3 + 4 * Math.sin(x * 0.05) + 2 * Math.sin(x * 0.13 + 1)) * smooth(96, 126, x)); R(x, top, 1, HZ - top, K.far); R(x, HZ - 2, 1, 2, K.far2); }
  K.sea.forEach((c, i) => R(0, HZ + i * 9, W, 9, c)); R(0, HZ, W, 1, '#c8e6ef');
}
function paintLand() {
  for (let x = 0; x < 142; x++) { const t = hillY(x); R(x, t, 1, SHORE - t, K.hill); }
  for (let k = 0; k < 40; k++) { const x = Math.floor(hash(k) * 136), y = hillY(x) + 2 + Math.floor(hash(k + 9) * 6); if (y < SHORE - 8) { R(x, y, 3, 1, K.scrub); P(x, y + 1, K.scrubS); P(x + 1, y + 1, K.scrubS); } }
  // the temple of Apollo, painted
  R(4, 29, 34, 1, K.marbleS); R(5, 28, 32, 1, K.marble); R(6, 27, 30, 1, K.marbleS);
  R(7, 19, 28, 8, '#d8cdb6');
  for (let i = 0; i < 7; i++) { R(7 + i * 4 + 1, 19, 2, 8, K.marble); P(7 + i * 4 + 2, 19, K.marble); R(7 + i * 4 + 2, 20, 1, 7, K.marbleS); }
  R(6, 17, 30, 2, K.marble); R(6, 16, 30, 1, '#7d9cc6'); R(5, 15, 32, 1, K.marble);
  for (let j = 0; j < 5; j++) { const half = 15 - j * 3; R(21 - half, 14 - j, half * 2, 1, j ? K.marble : K.marbleS); P(21 - half - 1, 14 - j, K.roof); P(21 + half, 14 - j, K.roof); }
  for (const [x, h] of [[2, 9], [39, 10], [42, 7]]) { R(x, 29 - h, 2, h, K.cyp); R(x, 29 - h, 1, h, K.cypS); P(x, 28 - h, K.cyp); }
  // houses in rows down the hill
  for (let yb = 38, r = 0; yb <= SHORE - 6; yb += 5, r++) {
    for (let x = (r * 3) % 7 - 3; x < 140; x += 8 + Math.floor(hash(r * 31 + x) * 3)) {
      const w = 5 + Math.floor(hash(x * 7 + r) * 2), h = 4;
      if (hillY(x + w + 1) > yb - 1 || (yb < 42 && x < 46)) continue;
      if (hash(x + r * 13) < 0.12) { R(x + 2, yb - 7, 2, 7, K.cyp); R(x + 2, yb - 7, 1, 7, K.cypS); P(x + 2, yb - 8, K.cyp); continue; }
      R(x, yb - h, w, h, K.wallF); R(x + w, yb - h, 1, h, K.wallS);
      R(x - 1, yb - h - 2, w + 2, 1, K.roof); R(x - 1, yb - h - 1, w + 2, 1, K.roofS);
      P(x + 1, yb - h + 1, K.win); if (w > 5) P(x + 4, yb - h + 1, K.win); if (hash(x * 3 + r) < 0.5) { P(x + w - 2, yb - 2, K.win); P(x + w - 2, yb - 1, K.win); }
    }

  R(0, 63, 142, 7, K.stone); R(0, 63, 142, 1, K.stoneL); R(0, 66, 142, 1, K.stoneJ); R(0, 69, 142, 1, K.stoneS);
  for (let x = 0; x < 142; x += 3) R(x, 61, 2, 2, K.stone);
  for (const tx of [10, 50, 100]) { R(tx, 55, 7, 15, K.stone); R(tx + 7, 55, 2, 15, K.stoneL); for (let i = 0; i < 9; i += 3) R(tx + i, 53, 2, 2, i > 6 ? K.stoneL : K.stone); R(tx + 3, 58, 1, 2, K.win); R(tx, 60, 9, 1, K.stoneJ); }
  R(30, 64, 5, 6, '#4e3e3e'); R(29, 63, 7, 1, K.stoneL);
  // the Sun-god's feet on his marble base, the scaffold, the earth ramp and the crane
  R(140, 66, 40, 4, K.hill); R(140, 70, 40, 2, K.stoneS);
  for (const x of [147, 158, 171]) R(x, 34, 1, 32, K.woodD);
  R(150, 57, 18, 9, K.marbleS); R(165, 57, 3, 9, K.marble); R(149, 56, 20, 1, K.marble); R(149, 65, 20, 1, K.marble);
  for (const fx of [151, 160]) { R(fx, 53, 7, 3, K.bronze); R(fx, 53, 1, 3, K.bronzeS); R(fx + 2, 45, 4, 8, K.bronze); R(fx + 2, 45, 1, 8, K.bronzeS); P(fx + 3, 43, '#6a6470'); P(fx + 3, 44, '#6a6470'); }
  for (let k = 0; k < 10; k++) R(168, 56 + k, 2 + k, 1, k ? '#c8a272' : '#d8b688');
  R(146, 38, 27, 1, K.wood); R(146, 47, 27, 1, K.wood); R(145, 34, 1, 32, K.wood); R(173, 34, 1, 32, K.wood);
  R(178, 24, 1, 42, K.woodS); line(178, 24, 157, 28, K.woodS); R(175, 60, 6, 6, K.wood); R(175, 60, 6, 1, K.rail);
  R(140, 60, 5, 6, '#9a6446'); R(144, 60, 1, 6, '#b47a52'); R(141, 55, 3, 5, '#8a5a40'); P(142, 63, '#ffb050'); P(141, 64, '#e87a2a');
  // the mole, its tower, and ships tied up behind it

  R(178, 70, 46, 2, K.stoneL); R(178, 72, 46, 2, K.stoneS);

function elpis() {   // our ship, flat: rail, painted band, eye, planks, and a furled sail
  return spr(80, 54, () => {
    const wl = 48, top = x => Math.round(wl - 8 - 5 * Math.pow(1 - smooth(4, 18, x), 1.5) - 3 * Math.pow(smooth(56, 72, x), 2));

    R(20, 8, 40, 1, K.woodS); R(22, 9, 36, 2, K.linen); R(22, 11, 36, 1, K.linenS); for (let x = 26; x < 58; x += 7) R(x, 9, 1, 3, K.woodS);
    for (let x = 4; x <= 72; x++) {
      const t = top(x), b = x < 9 ? wl - (9 - x) : x > 69 ? wl - (x - 69) * 2 : wl;
      for (let y = t; y <= b; y++) { const d = y - t; P(x, y, d === 0 ? K.rail : d <= 2 ? K.band : d === 3 ? K.hullS : y >= wl - 1 ? '#3e2818' : (d % 3 === 0 ? K.hullS : K.hull)); }
    }
    const t5 = top(5); for (const [x, y] of [[5, t5 - 1], [4, t5 - 2], [3, t5 - 3], [3, t5 - 4], [3, t5 - 5], [4, t5 - 6], [5, t5 - 7], [6, t5 - 7], [7, t5 - 6]]) { P(x, y, K.hull); P(x + 1, y, K.rail); }   // the goose-neck over the stern
    R(73, top(72) - 4, 1, 5, K.hull); P(74, top(72) - 5, K.rail);
    const ex = 63, ey = top(63) + 1; R(ex, ey, 3, 2, '#f6efe2'); P(ex + 1, ey, '#2a1c1c'); P(ex + 1, ey + 1, '#2a1c1c');
    for (let k = 0; k < 4; k++) { R(44 + k * 3, top(44 + k * 3) - 2, 2, 2, '#c8783e'); }
