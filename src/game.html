<title>Emporos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A pixel-art trading game. A young Rhodian trader sails from Rhodes to Halicarnassus and back, in 290 BC.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  /* Layout: a pixel-art window onto the harbour or the sea fills the top of the screen, like the picture on a painted cup.
     The trader's ledger sits below it, with tabs pinned to the bottom on phones; wide screens put the two side by side.
     One look: black-glaze ground, terracotta and bone, Aegean blue for water. */
  --glaze: #16100c;
  --glaze-2: #201711;
  --glaze-3: #2c2018;
  --line: #4b3727;
  --line-soft: #34261b;
  --clay: #d97b46;
  --clay-hi: #f2a36d;
  --clay-deep: #9e4f28;
  --on-clay: #1c0f07;
  --bone: #f2e6cb;
  --bone-dim: #bba887;
  --aegean: #66b8db;
  --olive: #b8c468;
  --wine: #ec6f80;
  --gold: #eac05a;
  --scrim: rgba(16, 11, 8, 0.9);
  --scrim-soft: rgba(16, 11, 8, 0.66);
  --scrim-clear: rgba(16, 11, 8, 0);
  --font-pixel: "Pixelify Sans", ui-monospace, "Courier New", monospace;
  --font-story: "Literata", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; font-variant-ligatures: none !important; }   /* the pixel face draws "fi" as one broken glyph, and every font shorthand would turn ligatures back on */
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--glaze); color: var(--bone);
  font: 16px/1.5 var(--font-story);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; border-radius: 0; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
canvas, .pix { image-rendering: crisp-edges; image-rendering: pixelated; }

#app {
  height: 100%; max-width: 640px; margin: 0 auto;
  display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto;
  background: var(--glaze);
}

/* ---------- the window: purse and place across the sky, the story across the foot ---------- */
.stage {
  position: relative; height: clamp(230px, 40vh, 380px); overflow: hidden; background: #2a3a5a;
  user-select: none; -webkit-user-select: none; touch-action: manipulation; transition: height 0.25s ease;
}
@supports (height: 1dvh) { .stage { height: clamp(230px, 40dvh, 380px); } }
#app.compact .stage { height: 104px; }
#scene { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: block; }
.hud {
  position: absolute; z-index: 3; top: 0; left: 0; right: 0; pointer-events: none;
  padding-top: 8px; padding-bottom: 26px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to bottom, var(--scrim-soft) 0, var(--scrim-soft) 62%, var(--scrim-clear) 100%);
}
.hud-row { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.purse { display: flex; align-items: center; gap: 7px; font: 700 24px/1 var(--font-pixel); font-variant-numeric: tabular-nums; text-shadow: 2px 2px 0 var(--glaze); }
.purse img { width: 22px; height: 22px; }
.purse .unit { font-size: 14px; font-weight: 500; color: var(--bone-dim); align-self: flex-end; padding-bottom: 2px; }
.purse b { transition: color 0.3s; }
.purse.up b { color: var(--olive); }
.purse.down b { color: var(--clay-hi); }
.hud-where { font: 500 13px/1.2 var(--font-pixel); color: var(--bone); letter-spacing: 0.07em; text-transform: uppercase; text-shadow: 1px 1px 0 var(--glaze); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spacer { flex: 1; }
.icon-btn {
  pointer-events: auto; flex: none; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; padding: 0;
  border: 2px solid var(--line); background: var(--scrim); color: var(--bone);
}
.icon-btn svg { width: 22px; height: 22px; shape-rendering: crispEdges; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px/1.2 var(--font-pixel); padding: 4px 7px; background: var(--scrim); border: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; }
.chip.bad { color: var(--wine); border-color: var(--wine); }
.chip.good { color: var(--olive); }
.chip.water { color: var(--aegean); }
.chip.food { color: var(--gold); }
.hotspots { position: absolute; inset: 0; z-index: 2; }
.hotspot { position: absolute; padding: 0; border: 0; background: transparent; cursor: pointer; }
.hotspot:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.banner {
  position: absolute; z-index: 3; left: 0; right: 0; top: 52%; text-align: center; pointer-events: none;
  font: 700 clamp(26px, 8vw, 44px)/1 var(--font-pixel); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--bone); text-shadow: 3px 3px 0 var(--glaze); opacity: 0; transition: opacity 0.7s;
}
.banner small { display: block; margin-top: 8px; font-size: 14px; font-weight: 500; letter-spacing: 0.14em; color: var(--gold); }
.banner.on { opacity: 1; }
.strip { margin-top: 6px; max-width: 38em; pointer-events: auto; cursor: pointer; }
.strip p { margin: 0; font: 15px/1.42 var(--font-story); min-height: 2.84em; text-shadow: 1px 1px 0 var(--glaze), 0 0 6px var(--glaze); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.strip p.in { animation: lineIn 0.5s ease-out; }
.strip p.bad { color: var(--clay-hi); }
.strip p.good { color: var(--olive); }
@keyframes lineIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
#app.compact .strip, #app.compact .chips { display: none; }
.meander { height: 14px; background-color: var(--glaze); background-repeat: repeat-x; background-size: 12px 14px; }

/* ---------- the ledger ---------- */
.panel {
  min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding-block: 14px 30px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.place { margin: 0; font: 700 28px/1.05 var(--font-pixel); letter-spacing: 0.03em; text-wrap: balance; }
.sub { margin: 5px 0 0; font: 500 13px/1.3 var(--font-pixel); color: var(--bone-dim); letter-spacing: 0.06em; text-transform: uppercase; }
.sec {
  margin: 24px 0 10px; display: flex; align-items: center; gap: 10px;
  font: 600 13px/1 var(--font-pixel); letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay);
}
.sec::after { content: ""; flex: 1; height: 2px; background: var(--line-soft); }
.goal { margin: 12px 0; padding: 10px 12px; border-left: 4px solid var(--clay); background: var(--glaze-2); font-size: 15px; }
.goal.warn { border-left-color: var(--wine); }
.journal { margin: 12px 0 4px; }
.journal p { margin: 0 0 8px; font-size: 15px; }
.journal p.bad { color: var(--clay-hi); }
.note { margin: 8px 0; font-size: 14px; color: var(--bone-dim); }
.btn {
  min-height: 44px; padding: 10px 14px; cursor: pointer; text-align: center;
  border: 2px solid var(--line); background: var(--glaze-2); color: var(--bone);
  font: 500 15px/1.15 var(--font-pixel);
  box-shadow: inset -2px -3px 0 rgba(0, 0, 0, 0.35), inset 2px 2px 0 rgba(255, 240, 220, 0.07);
}
.btn:active { box-shadow: inset 2px 3px 0 rgba(0, 0, 0, 0.35); }
.btn.primary { background: var(--clay); border-color: var(--clay-deep); color: var(--on-clay); font-weight: 700; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn small { display: block; margin-top: 3px; font: 400 12px/1.25 var(--font-pixel); opacity: 0.85; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns .btn { flex: 1 1 140px; }
.stack { display: grid; gap: 8px; }

.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; }
.person {
  display: grid; grid-template-columns: 48px minmax(0, 1fr); column-gap: 12px; row-gap: 2px; align-items: center;
  min-height: 70px; padding: 10px; text-align: left; cursor: pointer;
  border: 2px solid var(--line-soft); background: var(--glaze-2);
}
.person img { grid-row: span 3; width: 48px; height: 48px; background: var(--glaze-3); }
.person .nm { font: 600 15px/1.15 var(--font-pixel); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.person .rl, .person .tr { font: 400 12px/1.3 var(--font-pixel); color: var(--bone-dim); }
.person .tr b { color: var(--gold); font-weight: 500; }
.person.want { border-color: var(--clay-deep); }
.flag { font: 500 11px/1 var(--font-pixel); color: var(--on-clay); background: var(--gold); padding: 3px 5px; }
.flag.aboard { background: var(--olive); }

/* ---------- sheets: merchants, events, decisions ---------- */
#sheet { position: fixed; inset: 0; z-index: 20; display: grid; align-items: end; background: rgba(8, 5, 3, 0.62); }
.sheet-card {
  width: 100%; max-width: 640px; margin: 0 auto; max-height: 88%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--glaze); border-top: 3px solid var(--clay);
  padding-top: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  animation: sheetIn 0.22s ease-out;
}
@keyframes sheetIn { from { transform: translateY(26px); opacity: 0.4; } to { transform: none; opacity: 1; } }
.sheet-head { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; }
.sheet-head img { width: 64px; height: 64px; background: var(--glaze-3); }
.sheet-head h2 { margin: 0; font: 700 22px/1.05 var(--font-pixel); }
.sheet-head p { margin: 4px 0 0; font: 400 13px/1.25 var(--font-pixel); color: var(--bone-dim); }
.quote { margin: 14px 0 4px; font-style: italic; }
.reply { min-height: 1.5em; margin: 8px 0; color: var(--clay-hi); }
.reply.good { color: var(--olive); }
.trades { display: grid; }
.trade { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.trade img { width: 34px; height: auto; }
.trade .tn { font: 500 15px/1.15 var(--font-pixel); min-width: 0; }
.trade .tn small { display: block; margin-top: 2px; font: 400 12px/1.3 var(--font-pixel); color: var(--bone-dim); }
.trade .acts { display: flex; gap: 6px; align-items: center; }
.trade .pr { font: 700 16px/1 var(--font-pixel); color: var(--gold); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.trade .btn { min-width: 58px; padding: 8px 10px; }
.deal { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
.deal span { font: 400 13px/1.3 var(--font-pixel); color: var(--bone-dim); flex: 1 1 160px; }
.ev-title { margin: 0 0 10px; font: 700 23px/1.1 var(--font-pixel); color: var(--clay-hi); }
.ev-text p { margin: 0 0 10px; }
.ev-text p.out { color: var(--bone); }
.choices { display: grid; gap: 8px; margin-top: 14px; }
.choice { text-align: left; }
.choice small { font-family: var(--font-story); font-size: 13px; line-height: 1.35; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 14px; margin: 12px 0; font-size: 15px; }
.kv dt { font: 500 12px/1.6 var(--font-pixel); color: var(--bone-dim); text-transform: uppercase; letter-spacing: 0.07em; }
.kv dd { margin: 0; }
.kv .bad { color: var(--wine); } .kv .good { color: var(--olive); }

/* ---------- hold ---------- */
.hold-wrap { margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)) + env(safe-area-inset-left, 0px)); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)) + env(safe-area-inset-right, 0px)); }
#holdCanvas { display: block; margin: 0 auto; touch-action: none; cursor: grab; }
.hold-help { margin: 0 0 8px; font: 400 13px/1.35 var(--font-pixel); color: var(--bone-dim); }
.hold-info { min-height: 3.1em; margin: 8px 0; font-size: 15px; }
.hold-info.quiet { min-height: 0; margin: 0; }
.hold-info b { font-family: var(--font-pixel); font-weight: 600; }
.hold-info .bad { color: var(--wine); } .hold-info .good { color: var(--olive); }
.meters { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 6px 0 10px; font: 500 13px/1.3 var(--font-pixel); color: var(--bone-dim); font-variant-numeric: tabular-nums; }
.meters b { color: var(--bone); font-weight: 600; }

/* ---------- voyage ---------- */
.leg { margin: 0; font: 700 22px/1.1 var(--font-pixel); text-wrap: balance; }
.bars { display: grid; gap: 10px; margin: 14px 0; }
.bar { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: center; }
.bar > span { font: 500 12px/1 var(--font-pixel); text-transform: uppercase; letter-spacing: 0.08em; color: var(--bone-dim); }
.track { position: relative; height: 14px; background: var(--glaze-3); border: 2px solid var(--line-soft); }
.track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--aegean); }
.track.sun i { background: var(--gold); }
.track.sun.late i { background: var(--clay); }
.eta { margin: 0 0 8px; font-size: 15px; }
.eta.bad { color: var(--clay-hi); }
.ctrl { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: center; margin: 10px 0; }
.ctrl > span { font: 500 12px/1.2 var(--font-pixel); text-transform: uppercase; letter-spacing: 0.08em; color: var(--bone-dim); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 2px solid var(--line); }
.seg button { min-height: 44px; padding: 6px 8px; border: 0; border-left: 2px solid var(--line); background: var(--glaze-2); color: var(--bone-dim); font: 500 14px/1.1 var(--font-pixel); cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--clay); color: var(--on-clay); font-weight: 700; }
.seg.pagesw { margin: 0 0 8px; }
.seg.pagesw small { display: block; font: 400 11px/1.2 var(--font-pixel); opacity: 0.85; margin-top: 2px; }

/* ---------- crew and ledger ---------- */
.crew { display: grid; }
.mate { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.mate img { grid-row: span 2; width: 40px; height: 40px; background: var(--glaze-3); }
.mate .nm { font: 600 15px/1.15 var(--font-pixel); }
.mate .nm small { font-weight: 400; color: var(--bone-dim); margin-left: 6px; }
.mate .nt { grid-column: 2; font-size: 13px; line-height: 1.35; color: var(--bone-dim); }
.mate .st { grid-row: span 2; grid-column: 3; font: 500 12px/1 var(--font-pixel); padding: 4px 6px; border: 1px solid var(--line); color: var(--olive); }
.mate .st.wounded, .mate .st.sick { color: var(--wine); border-color: var(--wine); }
.goals { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.goals li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; font-size: 15px; }
.goals .box { width: 14px; height: 14px; margin-top: 4px; border: 2px solid var(--bone-dim); }
.goals li.done .box { background: var(--olive); border-color: var(--olive); }
.goals li.done span:last-child { color: var(--bone-dim); }
.log { list-style: none; margin: 0; padding: 0; }
.log li { padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 15px; }
.log .when { display: block; margin-bottom: 2px; font: 500 11px/1.2 var(--font-pixel); color: var(--clay); text-transform: uppercase; letter-spacing: 0.1em; }
.log li.quiet { color: var(--bone-dim); }
.log li.bad { color: var(--clay-hi); }
.log li.chap { padding: 14px 0 6px; font: 600 13px/1.2 var(--font-pixel); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); border-bottom: 2px solid var(--line); }

/* ---------- tabs ---------- */
.tabs {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--glaze-2); border-top: 2px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabs button {
  position: relative; min-height: 58px; display: grid; justify-items: center; align-content: center; gap: 4px; cursor: pointer;
  border: 0; border-top: 3px solid transparent; background: transparent; color: var(--bone-dim);
  font: 500 12px/1 var(--font-pixel); letter-spacing: 0.07em; text-transform: uppercase;
}
.tabs svg { width: 22px; height: 22px; shape-rendering: crispEdges; }
.tabs button[aria-selected="true"] { color: var(--bone); border-top-color: var(--clay); background: var(--glaze); }
.tabs .dot { position: absolute; top: 9px; left: calc(50% + 11px); width: 8px; height: 8px; background: var(--gold); }

/* ---------- theatre: the title, the opening, the end of the season ---------- */
#theater { position: fixed; inset: 0; z-index: 30; background: var(--glaze); display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.t-view { position: relative; overflow: hidden; min-height: 0; }
#tcanvas { position: absolute; top: 0; left: 50%; transform: translateX(-50%); }
.t-top { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; padding: 0 16px; }
.t-title h1 { margin: 0; font: 700 clamp(46px, 15vw, 84px)/0.9 var(--font-pixel); letter-spacing: 0.08em; color: var(--bone); text-shadow: 4px 4px 0 var(--glaze); }
.t-title p { margin: 12px 0 0; font: 500 14px/1.3 var(--font-pixel); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); text-shadow: 2px 2px 0 var(--glaze); }
.t-bottom {
  position: relative; padding-top: 18px; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 3px solid var(--clay); background: var(--glaze); max-height: 62vh; overflow-y: auto;
}
.t-text { max-width: 34em; margin: 0 auto; min-height: 5.2em; }
.t-text p { margin: 0 0 12px; font: 17px/1.55 var(--font-story); }
.t-text p.in { animation: lineIn 0.6s ease-out; }
.t-text .year { font: 600 15px/1.3 var(--font-pixel); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
.t-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 34em; margin: 6px auto 0; }
.t-actions .btn { flex: 1 1 200px; }
.t-hint { margin: 10px 0 0; text-align: center; font: 400 12px/1.2 var(--font-pixel); color: var(--bone-dim); }
.summary h2 { margin: 0; text-align: center; font: 500 13px/1.3 var(--font-pixel); letter-spacing: 0.14em; text-transform: uppercase; color: var(--bone-dim); }
.rating { margin: 6px 0 14px; text-align: center; font: 700 26px/1.1 var(--font-pixel); color: var(--gold); text-wrap: balance; }
.tally { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; margin: 0 0 14px; font-size: 15px; }
.tally dt { color: var(--bone-dim); }
.tally dd { margin: 0; text-align: right; font: 600 16px/1.4 var(--font-pixel); font-variant-numeric: tabular-nums; }
.tally .total { padding-top: 8px; border-top: 2px solid var(--line); color: var(--bone); }
.tally dt.total { margin-right: -16px; padding-right: 16px; }
.voyages { margin: 18px 0 4px; padding-top: 14px; border-top: 2px solid var(--line); }
.voyages h3 { margin: 0 0 12px; text-align: center; font: 500 13px/1.3 var(--font-pixel); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.voyages .tally dd small { display: block; font: 400 12px/1.3 var(--font-pixel); color: var(--bone-dim); }
.t-text p.shipnote { margin: 4px 0 12px; padding: 10px 12px; border: 2px solid var(--clay-deep); background: var(--glaze-2); font: 15px/1.5 var(--font-story); }
.note.good { color: var(--olive); }

.toast {
  position: fixed; z-index: 40; left: 50%; top: calc(58px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  width: max-content; max-width: min(92vw, 420px); padding: 10px 14px; pointer-events: none;
  background: var(--glaze-3); border: 2px solid var(--clay-deep); font: 500 14px/1.3 var(--font-pixel); opacity: 0; transition: opacity 0.2s;
}
.toast.on { opacity: 1; }

@media (min-width: 960px) {
  #app { max-width: 1280px; grid-template-columns: minmax(0, 1fr) 460px; grid-template-rows: minmax(0, 1fr) auto; }
  .stage, #app.compact .stage { grid-column: 1; grid-row: 1 / span 2; height: 100%; }
  .meander { display: none; }
  .panel { grid-column: 2; grid-row: 1; border-left: 2px solid var(--line); }
  .tabs { grid-column: 2; grid-row: 2; border-left: 2px solid var(--line); }
  #app.compact .strip { display: block; }
  #app.compact .chips { display: flex; }
  #sheet { align-items: center; }
  .sheet-card { max-width: 560px; max-height: 84%; border: 2px solid var(--line); border-top: 3px solid var(--clay); }
}
@media (prefers-reduced-motion: reduce) {
  .strip p.in, .t-text p.in, .sheet-card { animation: none; }
  .stage, .banner, .toast { transition: none; }
}

function rnd(s) {
  s.seed = (s.seed + 0x6D2B79F5) | 0;
  let t = Math.imul(s.seed ^ (s.seed >>> 15), 1 | s.seed);

  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const pick = (s, arr) => arr[Math.floor(rnd(s) * arr.length) % arr.length];

  aground: {

  blockade: {

      : ['Off the old harbour of Sarepta, two of King Ptolemy’s warships came out to meet them, long and low, with archers along the rails.',

function pumpStory(now) {
  while (OUT.length) UI.queue.push(OUT.shift());
  if (UI.queue.length > 3) { const tag = UI.queue.some(e => e.tone === 'dolphins'); UI.queue.splice(0, UI.queue.length - 3); if (tag) UI.dolphins = 9; }
  if (!UI.queue.length || now - UI.shownAt < UI.holdFor) return;
  const e = UI.queue.shift();
  els.stripText.textContent = e.text;
  els.stripText.className = e.tone === 'bad' || e.tone === 'good' ? e.tone : '';
  void els.stripText.offsetWidth; els.stripText.classList.add('in');
  if (e.tone === 'dolphins') UI.dolphins = 9;
  UI.shownAt = now;
  UI.holdFor = clamp(1300 + e.text.length * 30, 2200, 5400) * (UI.queue.length > 1 ? 0.55 : 1) / (S.phase === 'sea' ? Math.max(1, UI.speed * DEV.speed * 0.8) : 1);
}

    case 'speed': UI.speed = +b.dataset.v; break;
    case 'autopack': {

}
function toggleSound() { Snd.setMuted(!Snd.muted); try { localStorage.setItem(SOUND_KEY, Snd.muted ? '1' : '0'); } catch (e) { /* ignore */ } paintSound(); }

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) {
    if (TH.mode === 'intro' && e.target.closest('#theater')) { Snd.init(); if (TH.i < TH.lines.length - 1) { TH.i++; introStep(); } }

    return;
  }
  Snd.init();
  if (b.dataset.t) return theaterAct(b.dataset.t, b);
  if (b.dataset.tab) return setTab(b.dataset.tab);
  if (b.dataset.act) return doAct(b.dataset.act, b);
  if (b.id === 'menuBtn') return openSheet('menu');
  if (b.id === 'soundBtn') return toggleSound();
  if (b.dataset.m) return openSheet('merchant', b.dataset.m);

});
els.strip.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setTab('ledger'); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.sheet && UI.sheet.kind !== 'event') closeSheet(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

// ---- the loop ----
function syncSpots(spots, fit, key) {
  if (UI.spotsKey === key) return;
  UI.spotsKey = key;
  els.hotspots.innerHTML = spots.map(sp => { const m = MERCHANTS[sp.id]; return `<button class="hotspot" type="button" data-m="${sp.id}" aria-label="${esc(m.name)}, ${esc(m.role)}" style="left:${Math.round(sp.x0 * fit.P - fit.ox)}px;top:${sp.y0 * fit.P}px;width:${(sp.x1 - sp.x0) * fit.P}px;height:${(sp.y1 - sp.y0) * fit.P}px"></button>`; }).join('');
}
function seaOpts() {
  const v = S.voyage, idx = Object.keys(DAYS).indexOf(v.day);
  return { clock: v.clock, storm: UI.storm, calm: v.wind === 'calm', wind: v.wind, row: v.row && !S.pending, crew: Math.min(bigShip(S) ? 10 : 8, S.crew.length), seed: 3 + idx * 5, scroll: idx * 700 + v.prog * 240, pirate: UI.pirate, patrol: UI.patrol, dolphins: UI.dolphins, raiders: lemboi(S), open: openSea(S), deckLoad: S.items.filter(i => i.where === 'deck').length };
}
function drawMain(t) {
  const fit = fitPixels(els.scene, els.stage.clientWidth, els.stage.clientHeight, 140);
  G = els.scene.getContext('2d'); G.imageSmoothingEnabled = false;
  if (S.phase === 'sea' && S.voyage) { syncSpots([], fit, 'none'); drawSea(fit.W, fit.H, t, seaOpts()); return; }

  const spots = [], port = S.port || 'rhodes';
  (PORT_SCENES[port] || drawRhodes)(fit.W, fit.H, t, { clock: S.ch > 1 ? 0.4 : 0.3, stage: chapter(S).stage[S.home ? 1 : 0], spots, wants: UI.wants });
  if (S.phase === 'port' && !els.app.classList.contains('compact')) syncSpots(spots, fit, port + fit.W + 'x' + fit.H + ':' + fit.P + ':' + S.ch); else syncSpots([], fit, 'none');
}
function drawTheater(t) {
  const view = els.tcanvas.parentElement, fit = fitPixels(els.tcanvas, view.clientWidth, view.clientHeight, 150), C = chapter(S);
  G = els.tcanvas.getContext('2d'); G.imageSmoothingEnabled = false;
  if (TH.mode === 'title') drawSea(fit.W, fit.H, t, { clock: S.ch > 1 ? 0.12 : 0.06, storm: 0, calm: false, wind: 'fair', row: false, crew: 6, seed: 11, scroll: t * 6, pirate: null, dolphins: 0 });
  else drawRhodes(fit.W, fit.H, t, { clock: TH.mode === 'summary' ? 0.93 : C.season === 'summer' ? 0.42 : 0.3, stage: C.stage[TH.mode === 'summary' ? 1 : 0], walkers: true });
}
let lastFrame = 0, uiAcc = 1, saveAcc = 0;
function frame(now) {
  const dt = lastFrame ? Math.min(0.25, (now - lastFrame) / 1000) : 0, t = now / 1000;
  lastFrame = now;
  const sheetUp = !!UI.sheet, live = S.phase === 'sea' && !S.pending && !sheetUp && els.theater.hidden;
  if (live) tick(S, dt * UI.speed * DEV.speed);
  if (S.pending && (!UI.sheet || UI.sheet.kind !== 'event')) {
    closeSheet(); openSheet('event'); Snd.event();
    if (S.pending === 'pirates') { Snd.horn(); UI.pirate = { near: 0, fight: false, leaving: false }; }
    if (S.pending === 'blockade') { Snd.horn(); UI.patrol = { near: 0 }; }

  }

  }
  const stormy = S.phase === 'sea' && S.voyage && (S.voyage.wind === 'storm' || S.pending === 'squall' || S.pending === 'storm3' || S.pending === 'malea');
  UI.storm = clamp(UI.storm + (stormy ? dt * 0.8 : -dt * 0.4), 0, 1);
  UI.dolphins = Math.max(0, UI.dolphins - dt);
  const mood = S.phase === 'port' ? 'port' : S.phase === 'camp' ? 'night' : stormy ? 'storm' : 'sea';
  if (mood !== UI.mood && Snd.ctx) { UI.mood = mood; Snd.mood(mood); }
  onPhase();
  pumpStory(now);
  if (UI.bannerT > 0) { UI.bannerT -= dt; if (UI.bannerT <= 0) els.banner.classList.remove('on'); }
  if (els.theater.hidden) drawMain(t); else drawTheater(t);
  if (UI.tab === 'hold' && els.theater.hidden) { dragScroll(); drawHold(); }
  uiAcc += dt;
  if (uiAcc >= 0.12) {
    uiAcc = 0;
    UI.wants = new Set(S.phase === 'port' ? merchantsAt(S.port, S.ch).filter(id => wants(S, id).length || (MERCHANTS[id].bank && S.home && !S.loan.paid)) : []);
    updateHUD(); renderPanel(); updateTabs();
  }
  saveAcc += dt;
  if (saveAcc > 4) { saveAcc = 0; save(); }
  if (Snd.ctx) Snd.music(S.phase === 'port' ? 'port' : 'sea');
  requestAnimationFrame(frame);
}

// ---- boot ----
function start(data) {

  els.coinImg.src = scaledURL(COIN, 2);

}
const hotApi = window.claude && window.claude.hot;
if (hotApi && typeof hotApi.snapshot === 'function') { try { hotApi.snapshot(() => ({ state: S, tab: UI.tab })); } catch (e) { /* ignore */ } }
window.__emp = { state: () => S, speed: v => { DEV.speed = v; }, ui: UI, hold: HOLD, fns: { buy, sell, haggle, hire, autoPack, setSail, campAct, sleep, needsRoute, resolveEvent, repay, sailCheck, provisions, moveItem, fits, dockItems, atRisk, eta, countGood, sellPrice, merchantsAt, isCargo, takeLoan, nextChapter, offer, fitted, changeHull, buyShip, orderShip, fillCrew } };
